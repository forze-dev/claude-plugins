<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="hero-illustration-title">
	<title id="hero-illustration-title">A page layout with the request form open on top of it</title>

	<!-- The page being built, drawn as a wireframe on the light background. -->
	<g>
		<rect x="20" y="30" width="400" height="330" rx="20" fill="#ffffff" stroke="#dfe4de" stroke-width="1.5" />
		<line x1="20" y1="76" x2="420" y2="76" stroke="#dfe4de" stroke-width="1.5" />
		<circle cx="48" cy="53" r="4.5" fill="#14532d" fill-opacity="0.5" />
		<circle cx="66" cy="53" r="4.5" fill="#c6cfc6" />
		<circle cx="84" cy="53" r="4.5" fill="#c6cfc6" />

		<rect x="48" y="100" width="212" height="15" rx="7.5" fill="#14532d" />
		<rect x="48" y="126" width="146" height="15" rx="7.5" fill="#14532d" fill-opacity="0.42" />

		<rect x="48" y="162" width="286" height="8" rx="4" fill="#14532d" fill-opacity="0.16" />
		<rect x="48" y="180" width="244" height="8" rx="4" fill="#14532d" fill-opacity="0.16" />
		<rect x="48" y="198" width="196" height="8" rx="4" fill="#14532d" fill-opacity="0.16" />

		<rect x="48" y="224" width="124" height="34" rx="17" fill="#14532d" />

		<rect x="48" y="284" width="100" height="56" rx="12" fill="#f2f4f1" stroke="#dfe4de" stroke-width="1.5" />
		<rect x="160" y="284" width="100" height="56" rx="12" fill="#f2f4f1" stroke="#dfe4de" stroke-width="1.5" />
		<rect x="272" y="284" width="100" height="56" rx="12" fill="#f2f4f1" stroke="#dfe4de" stroke-width="1.5" />
	</g>

	<!-- The request form, lifted off the page. It is the component the whole
	     template is built around, so it gets the only real shadow. -->
	<g>
		<rect x="252" y="238" width="250" height="184" rx="18" fill="#111813" fill-opacity="0.07" />
		<rect x="248" y="228" width="250" height="184" rx="18" fill="#ffffff" stroke="#dfe4de" stroke-width="1.5" />

		<rect x="272" y="254" width="116" height="12" rx="6" fill="#14532d" />
		<rect x="272" y="276" width="176" height="7" rx="3.5" fill="#14532d" fill-opacity="0.3" />

		<rect x="272" y="298" width="202" height="28" rx="8" fill="#f2f4f1" stroke="#dfe4de" stroke-width="1.5" />
		<rect x="286" y="308" width="74" height="8" rx="4" fill="#14532d" fill-opacity="0.24" />

		<rect x="272" y="334" width="202" height="28" rx="8" fill="#e8f1ea" stroke="#14532d" stroke-width="1.5" />
		<rect x="286" y="344" width="98" height="8" rx="4" fill="#14532d" fill-opacity="0.45" />

		<rect x="272" y="372" width="118" height="28" rx="14" fill="#14532d" />
		<rect x="292" y="382" width="78" height="8" rx="4" fill="#ffffff" fill-opacity="0.9" />
	</g>
</svg>
